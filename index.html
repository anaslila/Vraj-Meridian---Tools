<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Website Under Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #faf7f2;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .maintenance-container {
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .gif-wrapper {
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: transparent;
        }

        .gif-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            outline: none;
            mix-blend-mode: multiply; /* Ensures it blends beautifully with your custom background */
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        p {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
            line-height: 1.5;
            padding: 0 10px;
        }

        .loader-dots {
            display: flex;
            gap: 6px;
            margin-top: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #92a3e1;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="gif-wrapper">
            <img src="https://s7.ezgif.com/tmp/ezgif-7b7023b01a58b38f.gif" alt="Maintenance Executing">
        </div>
        
        <h1>System Upgrades In Progress</h1>
        <p>We are fine tuning the calculation engines to give you an even faster experience. We'll be back online shortly!</p>
        
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
