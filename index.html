    <script>
        // Array of links. Add, remove, or change these links as you wish!
        const mediaLinks = [
            "https://i.postimg.cc/jD6rwgwH/Undermaintenece-of-RE-Calc-Splash-Screen.gif",
            "https://i.postimg.cc/gxyPXSXy/Undermaintenece-of-RE-Calc-Splash-Screen-(1).gif"

            "https://i.postimg.cc/Xr6bvSJr/Undermaintenece-of-RE-Calc-Splash-Screen-(3).gif"
        ];

        let currentIndex = 0;
        const imgElement = document.getElementById('display-gif');

        function updateMedia() {
            if (mediaLinks.length === 0) return;
            
            // Set the current image source
            imgElement.src = mediaLinks[currentIndex];
            
            // Move to the next index in a loop
            currentIndex = (currentIndex + 1) % mediaLinks.length;
        }

        // Initialize immediately
        updateMedia();

        // Run the loop: switch instantly every 5 seconds (5000 milliseconds)
        if (mediaLinks.length > 1) {
            setInterval(updateMedia, 5000);
        }
    </script>
